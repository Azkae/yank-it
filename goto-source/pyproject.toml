[project]
name = "goto-source"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click"]

[project.scripts]
goto-source = "goto_source:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["goto_source.py"]

[dependency-groups]
dev = ["pytest"]
